    <!-- Theme boot (USER law: explicit choice > system/auto > light): restore
         a SAVED toggle choice before first paint; with no saved choice the
         page is left un-stamped so the theme CSS's :root:not([data-theme])
         blocks follow the OS live. Versioned cutovers, each discards saved
         themes ONCE: v2 = the old light-default cutover (killed the workshop
         `theme` key). v3 = the tri-state cutover (2026-07-30) — stamps written
         by the OLD two-state toggle (07-15→07-30, every other click stamped
         'dark') predate the system state and must not outlive it. -->
    <script>
      try {
        if (localStorage.getItem('kol-theme-v') !== '3') {
          localStorage.removeItem('kol-theme')
          localStorage.removeItem('theme')
          localStorage.setItem('kol-theme-v', '3')
        }
        var t = localStorage.getItem('kol-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!-- THE BOOT CURTAIN (kol-fxr's, plan 25 § 5): the wait is the bundle download, so the curtain is
         static HTML that paints before any script — main.jsx fades it out after React's first commit.
         Inline CSS: the only styling that exists before the bundle. Theme follows the boot
         script's data-theme, else the system. -->
    <style>
      #kds-boot { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center;
        background: #FAFAFA; color: #0E0E11; transition: opacity 240ms ease; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #kds-boot { background: #121215; color: #FFFFFF; } }
      :root[data-theme="dark"] #kds-boot { background: #121215; color: #FFFFFF; }
      #kds-boot svg { width: 64px; height: 64px; animation: kds-boot-pulse 1.6s ease-in-out infinite; }
      #kds-boot.is-done { opacity: 0; pointer-events: none; }
      @keyframes kds-boot-pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { #kds-boot svg { animation: none; } #kds-boot { transition: none; } }
    </style>
  </head>
