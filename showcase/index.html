<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon-kol-ds.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kol-labs</title>
    <!-- Theme boot (USER law: explicit choice > system/auto > light): restore
         a SAVED toggle choice before first paint; with no saved choice the
         page is left un-stamped so the theme CSS's :root:not([data-theme])
         blocks follow the OS live. Versioned cutovers, each discards saved
         themes ONCE: v2 = the old light-default cutover (killed the workshop
         `theme` key). v3 = the tri-state cutover (2026-07-30) — stamps written
         by the OLD two-state toggle (07-15→07-30, every other click stamped
         'dark') predate the system state and must not outlive it. -->
    <script>
      try {
        if (localStorage.getItem('kol-theme-v') !== '3') {
          localStorage.removeItem('kol-theme')
          localStorage.removeItem('theme')
          localStorage.setItem('kol-theme-v', '3')
        }
        var t = localStorage.getItem('kol-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
