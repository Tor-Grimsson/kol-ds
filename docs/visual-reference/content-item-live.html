<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>The ContentCard system — live</title>
<link rel="stylesheet" href="../../packages/theme/kol-theme.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  button { border: 0; padding: 0; background: none; color: inherit; font: inherit; }
  h2, h3, h4, p { margin: 0; }

  body { margin: 0; font: 13px/1.5 "JetBrains Mono", monospace;
         padding: 32px 48px 140px;
         background: var(--kol-surface-primary); color: var(--kol-surface-on-primary); }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .note { font-size: 11px; opacity: .6; margin: 0 0 6px; max-width: 108ch; }

  .sect { font-size: 13px; font-weight: 600; margin: 56px 0 22px;
          padding-top: 18px; border-top: 1px solid var(--kol-fg-16); }
  .sect .num { opacity: .35; margin-right: 10px; }
  .sub { font-size: 11px; font-weight: 600; opacity: .6; margin: 26px 0 12px;
         letter-spacing: .06em; text-transform: uppercase; }

  .tag { font-size: 10px; opacity: .45; display: block; }
  .path { font-size: 10px; opacity: .3; }
  .bad { color: var(--ui-error, #c0392b); }
  .ok  { color: var(--ui-success, #2d8a4e); }

  .strip { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .item { display: flex; flex-direction: column; gap: 8px; }

  table { border-collapse: collapse; font-size: 11px; width: 100%; }
  th, td { text-align: left; padding: 7px 20px 7px 0; border-bottom: 1px solid var(--kol-fg-08);
           vertical-align: top; }
  th { font-weight: 600; opacity: .5; font-size: 10px; letter-spacing: .04em; }
  code { font-size: 10.5px; background: var(--kol-fg-08); padding: 1px 5px;
         border-radius: var(--kol-radius-sm); }
  td code { white-space: nowrap; }
  table.tv { table-layout: fixed; }
  table.tv td, table.tv th { overflow-wrap: anywhere; }

  .anat { font-size: 11px; line-height: 1.9; opacity: .8; white-space: pre; }

  /* ── tailwind shims — generated from the components’ real class lists ── */
  .\[\&\>img\]\:h-full>img{height:100%}
  .\[\&\>img\]\:object-cover>img{object-fit:cover}
  .\[\&\>img\]\:w-full>img{width:100%}
  .\[\&\>video\]\:h-full>video{height:100%}
  .\[\&\>video\]\:object-cover>video{object-fit:cover}
  .\[\&\>video\]\:w-full>video{width:100%}
  .\[letter-spacing\:0\.04em\]{letter-spacing:0.04em}
  .\[letter-spacing\:0\.12em\]{letter-spacing:0.12em}
  .absolute{position:absolute}
  .bg-\[var\(--kol-fg-02\)\]{background:var(--kol-fg-02)}
  .bg-fg-02{background:var(--kol-fg-02)}
  .bg-fg-04{background:var(--kol-fg-04)}
  .bg-surface-primary{background:var(--kol-surface-primary)}
  .bg-surface-secondary{background:var(--kol-surface-secondary)}
  .border{border:1px solid var(--kol-fg-12)}
  .border-\[var\(--kol-fg-24\)\]{border-color:var(--kol-fg-24)}
  .border-b{border-bottom:1px solid var(--kol-fg-08)}
  .border-dashed{border-style:dashed}
  .border-fg-04{border-color:var(--kol-fg-04)}
  .border-fg-08{border-color:var(--kol-fg-08)}
  .border-fg-24{border-color:var(--kol-fg-24)}
  .border-t{border-top:1px solid var(--kol-fg-04)}
  .box-border{box-sizing:border-box}
  .cursor-pointer{cursor:pointer}
  .flex{display:flex}
  .flex-1{flex:1 1 0%}
  .flex-col{flex-direction:column}
  .flex-wrap{flex-wrap:wrap}
  .font-mono{font-family:var(--kol-font-family-mono,monospace)}
  .gap-1{gap:4px}
  .gap-2{gap:8px}
  .gap-3{gap:12px}
  .gap-4{gap:16px}
  .gap-6{gap:24px}
  .gap-8{gap:32px}
  .gap-\[6px\]{gap:6px}
  .hidden{display:none}
  .items-baseline{align-items:baseline}
  .items-center{align-items:center}
  .items-end{align-items:flex-end}
  .items-start{align-items:flex-start}
  .items-stretch{align-items:stretch}
  .justify-between{justify-content:space-between}
  .justify-center{justify-content:center}
  .list-none{list-style:none}
  .m-0{margin:0}
  .mb-4{margin-bottom:16px}
  .min-w-0{min-width:0}
  .mt-8{margin-top:32px}
  .overflow-hidden{overflow:hidden}
  .p-0{padding:0}
  .p-3{padding:12px}
  .p-4{padding:16px}
  .p-6{padding:24px}
  .pb-4{padding-bottom:16px}
  .px-3{padding-left:12px;padding-right:12px}
  .px-4{padding-left:16px;padding-right:16px}
  .py-1{padding-top:4px;padding-bottom:4px}
  .py-2{padding-top:8px;padding-bottom:8px}
  .relative{position:relative}
  .rounded{border-radius:var(--kol-radius-sm)}
  .rounded-\[var\(--kol-radius-sm\)\]{border-radius:var(--kol-radius-sm)}
  .rounded-sm{border-radius:var(--kol-radius-xs)}
  .select-none{user-select:none}
  .shrink-0{flex-shrink:0}
  .text-center{text-align:center}
  .text-fg-32{color:var(--kol-fg-32)}
  .text-fg-40{color:var(--kol-fg-40)}
  .text-fg-48{color:var(--kol-fg-48)}
  .text-fg-64{color:var(--kol-fg-64)}
  .text-fg-80{color:var(--kol-fg-80)}
  .text-right{text-align:right}
  .transition-colors{transition:color var(--kol-transition-fast),background var(--kol-transition-fast),border-color var(--kol-transition-fast)}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .w-20{width:80px}
  .w-24{width:96px}
  .w-full{width:100%}

  body.guides-on .gbox { outline: 1px dashed var(--guide-key); outline-offset: 0; }
  .bar { position: fixed; bottom: 16px; left: 48px; z-index: 20; display: flex; gap: 8px; }
  .chip { font: 11px/1 "JetBrains Mono", monospace; letter-spacing: 1px;
    padding: 9px 14px; border-radius: var(--kol-radius-sm); cursor: pointer;
    border: 1px solid var(--kol-fg-12);
    background: var(--kol-surface-inverse); color: var(--kol-surface-on-inverse); }
  body:not(.guides-on) #guides-chip { opacity: .5; }
</style>
</head>
<body class="guides-on">
<div class="bar">
  <button id="theme-chip" class="chip" type="button">theme · light</button>
  <button id="guides-chip" class="chip" type="button" aria-pressed="true">guides · on</button>
</div>
<div id="mount"></div>

<script>
const root = document.documentElement;
const themeChip = document.getElementById('theme-chip');
const guidesChip = document.getElementById('guides-chip');
const setGuideKey = () => document.body.style.setProperty('--guide-key',
  root.getAttribute('data-theme') === 'light' ? '#CA3ABC' : '#F2D24B');
setGuideKey();
themeChip.addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
  themeChip.textContent = `theme · ${next}`;
  setGuideKey();
});
guidesChip.addEventListener('click', () => {
  const on = document.body.classList.toggle('guides-on');
  guidesChip.textContent = `guides · ${on ? 'on' : 'off'}`;
  guidesChip.setAttribute('aria-pressed', String(on));
});
</script>
