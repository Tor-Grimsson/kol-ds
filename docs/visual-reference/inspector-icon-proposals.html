<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kol-ds-ui — inspector icon batch proposals</title>
<style>
  body { margin: 0; font: 13px/1.5 "JetBrains Mono", monospace; display: flex; min-height: 100vh; }
  .pane { flex: 1; padding: 32px 40px; }
  .pane.light { background: #fafafa; color: #111; }
  .pane.dark  { background: #111; color: #fafafa; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .sub { font-size: 10px; opacity: .45; margin: 0 0 24px; }
  .row { margin-bottom: 36px; }
  .name { font-size: 12px; opacity: .55; margin-bottom: 10px; }
  .name .cat { opacity: .55; }
  .name .path { font-size: 10px; opacity: .45; }
  .cells { display: flex; align-items: flex-end; gap: 28px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 96px; }
  .cell.wide { width: auto; }
  .cell .tag { font-size: 10px; opacity: .45; }
  .ramp { display: flex; align-items: flex-end; gap: 14px; }
  .rstep { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rstep .tag { font-size: 10px; opacity: .45; }
  .refs { display: flex; gap: 14px; align-items: center; padding-left: 20px;
          margin-left: 8px; border-left: 1px solid rgba(128,128,128,.3); }
  .sep { height: 1px; background: rgba(128,128,128,.25); margin: 28px 0; }
  .head { display: flex; gap: 28px; font-size: 10px; opacity: .45; margin: 0 0 18px; }
  .head .c96 { width: 96px; text-align: left; }
  .head .cramp { width: 196px; text-align: left; }
  .head .crefs { padding-left: 20px; margin-left: 8px; }
  .icel { position: relative; display: inline-block; line-height: 0; }
  .cell svg { display: block; }
  /* visibility, not display — .cell svg { display:block } out-specifies .guide */
  .guide { position: absolute; inset: 0; width: 100%; height: 100%;
           pointer-events: none; visibility: hidden; }
  body.guides-on .guide { visibility: visible; }
  .standin { font: 11px/1 "JetBrains Mono", monospace; padding: 8px 10px;
             border: 1px solid rgba(128,128,128,.4); border-radius: 4px; opacity: .7; }
  .guides-btn { position: fixed; bottom: 16px; transform: translateX(-50%);
    z-index: 10; font: 11px/1 "JetBrains Mono", monospace; letter-spacing: 1px;
    padding: 8px 14px; border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(128,128,128,.4); }
  #guides-btn-l { left: 25%; background: #1a1a1d; color: rgba(250,250,250,.92); }
  #guides-btn-r { left: 75%; background: #fafafa; color: rgba(17,17,17,.92); }
  body:not(.guides-on) #guides-btn-l { color: rgba(250,250,250,.45); }
  body:not(.guides-on) #guides-btn-r { color: rgba(17,17,17,.45); }
</style>
</head>
<body class="guides-on">
<button id="guides-btn-l" class="guides-btn" type="button" aria-pressed="true">guides · on</button>
<button id="guides-btn-r" class="guides-btn" type="button" aria-pressed="true">guides · on</button>
<div class="pane light"><div id="mount-light"></div></div>
<div class="pane dark"><div id="mount-dark"></div></div>
<script>
/* Proposed drawings — the .svg files beside this page, inlined. */
const P = {
  'resize-fixed': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 8V16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 8V16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'resize-auto-w': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 8V16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12H15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 9L15.5 12L12.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'resize-auto-h': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 19H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 5V15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 12.5L12 15.5L15 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'constrain': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 6.5H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 12V16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 6.5V10C14 12.2091 12.2091 14 10 14H6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'corner-radius': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.5 12V9C4.5 6.51472 6.51472 4.5 9 4.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 12V15C19.5 17.4853 17.4853 19.5 15 19.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'opacity': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4.5" y="4.5" width="15" height="15" rx="1" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12.5" cy="11.5" r="1" fill="currentColor"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="9.5" cy="14.5" r="1" fill="currentColor"/><circle cx="12.5" cy="14.5" r="1" fill="currentColor"/><circle cx="15.5" cy="14.5" r="1" fill="currentColor"/></svg>`,
  'line-height': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 16.5L9 7.5L13 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.4 13H11.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 6.5V17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 9L18 6.5L20.5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 15L18 17.5L20.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'letter-spacing': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.5 7V17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 7V17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 16.5L12 7.5L15.5 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.7 13.5H14.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'angle': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 5V18H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11C9.86599 11 13 14.134 13 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'mask': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 4.5C16.1421 4.5 19.5 7.85786 19.5 12C19.5 16.1421 16.1421 19.5 12 19.5V4.5Z" fill="currentColor"/></svg>`,
};

/* Live set drawings — interim stand-ins and refs, copied verbatim from
 * packages/icons/src/kol-icon-set-v1/. */
const SET = {
  'maximize': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4H4V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 4H20V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15V20H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 15V20H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'ptrn-dot': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="6" cy="6" r="3" fill="currentColor"/><circle cx="18" cy="6" r="3" fill="currentColor"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="18" cy="18" r="3" fill="currentColor"/></svg>`,
  'ptrn-checker': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="9" height="9" fill="currentColor"/><rect x="12" y="12" width="9" height="9" fill="currentColor"/><rect x="3" y="3" width="18" height="18" rx="1" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 3V21M3 12H21" stroke="currentColor" stroke-width="1.5"/></svg>`,
  'rows': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.4" cy="6.4" r="2.4"/><path d="M6.4 8.8V16.4C6.4 17.28 7.12 18 8 18H12.4"/><path d="M10.4 20L12.8 18L10.4 16"/></g><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 12 12)"><circle cx="6.4" cy="6.4" r="2.4"/><path d="M6.4 8.8V16.4C6.4 17.28 7.12 18 8 18H12.4"/><path d="M10.4 20L12.8 18L10.4 16"/></g></svg>`,
  'type': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.37207 4.96875L12.8838 17.002L16.2725 9.01953C16.4105 8.69543 16.7297 8.48438 17.082 8.48438H17.9609C18.1335 8.48442 18.3024 8.53558 18.4463 8.63086C18.5901 8.7262 18.7032 8.8616 18.7705 9.02051L23 19.0322H21.0918L19.9775 16.3955H15.0518L13.9336 19.0322C13.8283 19.0322 13.7271 19.0175 13.6309 18.9941L13.6455 19.0322H11.7666L10.1191 14.6367H4.52637L2.87793 19.0322H1L6.27344 4.96875H8.37207ZM15.7988 14.6367H19.2354L17.5205 10.5801L15.7988 14.6367ZM5.18457 12.8789H9.45996L7.32227 7.17969L5.18457 12.8789Z" fill="currentColor"/></svg>`,
  'grid': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.5 3.5H4.5C3.94772 3.5 3.5 3.94772 3.5 4.5V9.5C3.5 10.0523 3.94772 10.5 4.5 10.5H9.5C10.0523 10.5 10.5 10.0523 10.5 9.5V4.5C10.5 3.94772 10.0523 3.5 9.5 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 3.5H14.5C13.9477 3.5 13.5 3.94772 13.5 4.5V9.5C13.5 10.0523 13.9477 10.5 14.5 10.5H19.5C20.0523 10.5 20.5 10.0523 20.5 9.5V4.5C20.5 3.94772 20.0523 3.5 19.5 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 13.5H4.5C3.94772 13.5 3.5 13.9477 3.5 14.5V19.5C3.5 20.0523 3.94772 20.5 4.5 20.5H9.5C10.0523 20.5 10.5 20.0523 10.5 19.5V14.5C10.5 13.9477 10.0523 13.5 9.5 13.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 13.5H14.5C13.9477 13.5 13.5 13.9477 13.5 14.5V19.5C13.5 20.0523 13.9477 20.5 14.5 20.5H19.5C20.0523 20.5 20.5 20.0523 20.5 19.5V14.5C20.5 13.9477 20.0523 13.5 19.5 13.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'target': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 13C12.5523 13 13 12.5523 13 12C13 11.4477 12.5523 11 12 11C11.4477 11 11 11.4477 11 12C11 12.5523 11.4477 13 12 13Z" fill="currentColor"/><path d="M12 2V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 20V22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'aa': `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 16.75L6.5 7.25L10 16.75M4.4 13.25H8.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 16.75L17.5 7.25L21 16.75M15.4 13.25H19.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

/* Per-row config: proposed group home · interim stand-in · set refs. */
const ROWS = [
  { name: 'resize-fixed',   group: 'layout',     standin: { text: 'Fixed' },     note: 'text label (interim)',      refs: ['grid', 'maximize'] },
  { name: 'resize-auto-w',  group: 'layout',     standin: { text: 'Auto W' },    note: 'text label (interim)',      refs: ['grid', 'maximize'] },
  { name: 'resize-auto-h',  group: 'layout',     standin: { text: 'Auto H' },    note: 'text label (interim)',      refs: ['grid', 'maximize'] },
  { name: 'constrain',      group: 'layout',     standin: { svg: 'maximize' },   note: 'maximize (interim)',        refs: ['maximize', 'target'] },
  { name: 'corner-radius',  group: 'layout',     standin: { svg: 'maximize' },   note: 'maximize (interim)',        refs: ['maximize', 'grid'] },
  { name: 'opacity',        group: 'tools',      standin: { svg: 'ptrn-dot' },   note: 'ptrn-dot (interim)',        refs: ['ptrn-dot', 'ptrn-checker'] },
  { name: 'line-height',    group: 'typography', standin: { svg: 'rows' },       note: 'rows (interim)',            refs: ['type', 'aa'] },
  { name: 'letter-spacing', group: 'typography', standin: { svg: 'type' },       note: 'type (interim)',            refs: ['type', 'aa'] },
  { name: 'angle',          group: 'tools',      standin: { text: 'R' },         note: 'text prefix "R" (interim)', refs: ['target', 'grid'] },
  { name: 'mask',           group: 'tools',      standin: null,                  note: 'absent (feature off)',      refs: ['target', 'ptrn-checker'] },
];

const GUIDE = (bgLight) => {
  const diag = '#0A8DA4';
  const key = bgLight ? '#CA3ABC' : '#F2D24B';   /* KeylineBg verbatim */
  return `<svg class="guide" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <g stroke="${diag}" stroke-width="0.1" stroke-dasharray="0.4 0.6" fill="none">
      <path d="M0 0 L24 24"/><path d="M24 0 L0 24"/></g>
    <g stroke="${key}" stroke-width="0.1" stroke-dasharray="0.4 0.6" fill="none">
      <rect x="4" y="2" width="16" height="20" rx="1"/>
      <rect x="3" y="3" width="18" height="18" rx="1"/>
      <rect x="2" y="4" width="20" height="16" rx="1"/>
      <circle cx="12" cy="12" r="4"/></g></svg>`;
};
const sz = (svg, n, bgLight) =>
  `<span class="icel">${svg.replace('<svg ', `<svg width="${n}" height="${n}" `)}${GUIDE(bgLight)}</span>`;

function render(mount, label) {
  const bgLight = label === 'light';
  let html = `<h1>inspector icon batch proposals — ${label}</h1>`;
  html += `<div class="sub">stroke 1.5u on the 24 grid → 1px @16 · 1.25px @20 · 1.5px @24 · 2px @32 · 3px @48 · 6px @96 — proposed files: _tmp/2026-08-12-inspector-icon-proposals/&lt;name&gt;.svg</div>`;
  html += `<div class="head"><span class="c96">current · 96px</span><span class="c96">proposed · 96px · stroke 6px</span><span class="cramp">proposed ramp 16–48px</span><span class="crefs">set refs · 24px</span></div>`;
  for (const row of ROWS) {
    html += `<div class="row"><div class="name">${row.name} <span class="cat">· ${row.group}</span> <span class="path">— packages/icons/src/kol-icon-set-v1/${row.group}/${row.name}.svg (proposed home)</span></div><div class="cells">`;
    const cur = row.standin
      ? (row.standin.svg ? sz(SET[row.standin.svg], 96, bgLight) : `<span class="standin">${row.standin.text}</span>`)
      : `<span class="standin">absent</span>`;
    html += `<div class="cell">${cur}<span class="tag">${row.note}</span></div>`;
    html += `<div class="cell">${sz(P[row.name], 96, bgLight)}</div>`;
    html += `<div class="cell wide"><div class="ramp">${[16, 20, 24, 32, 48].map((n) =>
      `<div class="rstep">${sz(P[row.name], n, bgLight)}<span class="tag">${n}</span></div>`).join('')}</div></div>`;
    html += `<div class="refs">${row.refs.map((r) => sz(SET[r], 24, bgLight)).join('')}</div>`;
    html += `</div><div class="sep"></div></div>`;
  }
  mount.innerHTML = html;
}
render(document.getElementById('mount-light'), 'light');
render(document.getElementById('mount-dark'), 'dark');
const btns = [document.getElementById('guides-btn-l'), document.getElementById('guides-btn-r')];
btns.forEach((b) => b.addEventListener('click', () => {
  const on = document.body.classList.toggle('guides-on');
  btns.forEach((x) => {
    x.textContent = `guides · ${on ? 'on' : 'off'}`;
    x.setAttribute('aria-pressed', String(on));
  });
}));
</script>
</body>
</html>
