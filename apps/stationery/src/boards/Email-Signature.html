<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOYAGER email signature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D121C}a:hover{color:#850F36}
</style>
</head>
<body>
<div style="width: 1200px; height: 440px; box-sizing: border-box; padding: 40px 48px; background: #FFFFFF; color: #2D121C; font-family: Inter, 'Helvetica Neue', Arial, sans-serif; display: grid; grid-template-columns: 1.3fr 1fr; gap: 60px;">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A93A0;">Full · new emails</div>
    <div style="display: flex; gap: 26px; align-items: flex-start; padding-top: 22px; border-top: 1.5px solid #E5E3DF;">
      <img src="__LOGOMARK__" alt="VOYAGER" style="width: 72px; height: 72px; display: block;">
      <div style="font-size: 22px; line-height: 32px;">
        <div style="font-weight: 600;">Sigrún Hafsteinsdóttir</div>
        <div style="color: #5C6675;">Managing Director, VOYAGER ehf.</div>
        <div style="margin-top: 12px; font-size: 20px; line-height: 30px;"><a href="mailto:hello@voyager.example">hello@voyager.example</a> · +354 555 0142</div>
        <div style="font-size: 20px; line-height: 30px;"><a href="https://voyager.example" style="color: #850F36;">voyager.example</a></div>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A93A0;">Compact · replies</div>
    <div style="padding-top: 22px; border-top: 1.5px solid #E5E3DF; font-size: 20px; line-height: 30px;">
      <div><b style="font-weight: 600;">Sigrún Hafsteinsdóttir</b> · VOYAGER</div>
      <div><a href="https://voyager.example" style="color: #850F36;">voyager.example</a> · +354 555 0142</div>
    </div>
    <div style="font-size: 15px; line-height: 22px; color: #8A93A0;">Shown at 2×. Build at 50%: text 10–11 px, mark 36 px, Arial fallback for mail clients.</div>
  </div>
</div>
</body>
</html>
