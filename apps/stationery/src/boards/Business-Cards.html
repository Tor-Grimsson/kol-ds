<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOYAGER business cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1100px; height: 820px; box-sizing: border-box; padding: 48px 45px; background: #E4E1DB; color: #2D121C; font-family: Inter, 'Helvetica Neue', Arial, sans-serif; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 46px;">
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C6675;">A · Front</div>
    <div style="width: 482px; height: 312px; box-sizing: border-box; position: relative; background: #FAF9F6; padding: 34px;">
      <div style="font-size: 20px; line-height: 26px; font-weight: 600;">Sigrún Hafsteinsdóttir</div>
      <div style="font-size: 17px; line-height: 24px;">Managing Director</div>
      <img src="__LOGOMARK__" alt="" aria-hidden="true" style="position: absolute; right: 30px; top: 30px; width: 64px; height: 64px;">
      <div style="position: absolute; left: 34px; bottom: 30px; font-size: 14px; line-height: 20px;">hello@voyager.example<br>+354 555 0142<br>voyager.example</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C6675;">A · Back</div>
    <div style="width: 482px; height: 312px; box-sizing: border-box; background: #252A33; display: flex; align-items: center; justify-content: center;">
      <img src="__LOCKUP__" alt="VOYAGER" style="width: 300px; height: auto; display: block;">
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C6675;">B · Front</div>
    <div style="width: 482px; height: 312px; box-sizing: border-box; position: relative; background: #252A33; color: #F4F2EE; padding: 34px;">
      <img src="__WORDMARK__" alt="VOYAGER" style="height: 30px; width: auto; display: block;">
      <div style="position: absolute; left: 34px; bottom: 30px;">
        <div style="font-size: 20px; line-height: 26px; font-weight: 600;">Sigrún Hafsteinsdóttir</div>
        <div style="font-size: 15px; line-height: 22px; color: #B9BEC6;">Managing Director · hello@voyager.example · +354 555 0142</div>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C6675;">B · Back</div>
    <div style="width: 482px; height: 312px; box-sizing: border-box; background: #850F36; display: flex; align-items: center; justify-content: center;">
      <img src="__LOGOMARK__" alt="VOYAGER mark" style="width: 140px; height: 140px; display: block;">
    </div>
  </div>
</div>
</body>
</html>
