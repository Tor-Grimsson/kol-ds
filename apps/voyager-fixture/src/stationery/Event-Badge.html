<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event name badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 596px; height: 840px; position: relative; box-sizing: border-box; background: #F4F2EE; color: #2D121C; font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 18px; line-height: 26px; overflow: hidden;">
  <div style="position: absolute; left: 50%; top: 34px; width: 90px; height: 16px; margin-left: -45px; border-radius: 8px; background: #D9D6D0;"></div>
  <div style="position: absolute; left: 48px; right: 48px; top: 96px; display: flex; justify-content: space-between; align-items: center;">
    <img src="__LOCKUP__" alt="VOYAGER" style="height: 32px; width: auto; display: block;">
    <span style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A93A0;">[Event name]</span>
  </div>
  <div style="position: absolute; left: 48px; right: 48px; top: 300px;">
    <div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 96px; line-height: 0.95; font-weight: 700; text-transform: uppercase;">[First<br>name]</div>
    <div style="margin-top: 18px; font-size: 24px; line-height: 32px;">[Last name]</div>
    <div style="color: #5C6675;">[Company or role]</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; box-sizing: border-box; padding: 0 48px; background: #850F36; color: #F4F2EE; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 40px; line-height: 1; font-weight: 600; text-transform: uppercase;">[Guest]</span>
    <img src="__LOGOMARK__" alt="" aria-hidden="true" style="width: 64px; height: 64px;">
  </div>
</div>
</body>
</html>
