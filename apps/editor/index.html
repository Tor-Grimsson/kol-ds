<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon-kol-ds.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KOL editor</title>
    <script>
      // kol-framework THEME_BOOT_SCRIPT — stamps the saved theme before paint (no flash).
      // Apps share an origin with the showcase, so they share its `kol-theme` key;
      // an app without this script ignores a choice made on the other surface.
      try {
        if (localStorage.getItem('kol-theme-v') !== '3') {
          localStorage.removeItem('kol-theme')
          localStorage.removeItem('theme')
          localStorage.setItem('kol-theme-v', '3')
        }
        var t = localStorage.getItem('kol-theme')
        var v = localStorage.getItem('kolbox-theme-variant')
        var kolbox = false
        try { kolbox = JSON.parse(localStorage.getItem('kol-editor-settings') || '{}').style === 'kolbox' } catch (e) {}
        if (kolbox) {
          // the kolbox style boots as apps/kolbox does (R1): the variant its Settings › Theme row picked, kolbox when
          // none (and for the retired mono), and dark unless a theme was chosen
          document.documentElement.dataset.themeVariant = !v || v === 'mono' ? 'kolbox' : v
          if (t !== 'system') document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        } else {
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
          // the theme variant the kolbox style's Settings › Theme row picks (C3); unset, none, as before
          if (v) document.documentElement.dataset.themeVariant = v
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
