<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon-kol-ds.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Studio</title>
    <!-- save to home screen as an app (his review 2026-10-23): manifest + Apple meta, icons in public/apps/. On the
         dev server the Apple meta is what iOS reads; the manifest's start_url is the built path. -->
    <link rel="manifest" href="/apps/studio-hub.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <link rel="apple-touch-icon" href="/apps/app-icon-180.png" />
    <meta name="theme-color" content="#121215" />
    <script>
      // kol-framework THEME_BOOT_SCRIPT — stamps the saved theme before paint (no flash).
      // Apps share an origin with the showcase, so they share its `kol-theme` key;
      // an app without this script ignores a choice made on the other surface.
      try {
        if (localStorage.getItem('kol-theme-v') !== '3') {
          localStorage.removeItem('kol-theme')
          localStorage.removeItem('theme')
          localStorage.setItem('kol-theme-v', '3')
        }
        var t = localStorage.getItem('kol-theme')
        // DARK BY DEFAULT (his review 2026-10-23): a stored choice still wins (explicit > system > light),
        // but with nothing stored this app is dark, as the studio apps are.
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark'
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
