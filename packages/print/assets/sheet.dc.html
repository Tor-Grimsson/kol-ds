<style>
body{margin:0}
.c{color:#111111;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:18px;line-height:27px;font-variant-numeric:tabular-nums;text-wrap:pretty}
.c>:first-child{margin-top:0 !important}
.c .eyebrow{font-size:15px;line-height:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#888888;margin:0}
.c h1,.c h2,.c h3,.c h4{text-wrap:balance;margin:0;font-weight:700}
.c h1,.c h2.chap{font-size:44px;line-height:52px;margin:8px 0 0;display:flex;gap:16px;align-items:baseline;letter-spacing:-0.005em}
.c h2.chap .num{color:#AD5038}
.c .parties{margin:34px 0 0;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));column-gap:22.7px}
.c .parties .lbl{font-size:15px;line-height:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#888888}
.c h2{font-size:30px;line-height:38px;margin:56px 0 16px;display:flex;gap:14px;align-items:baseline}
.c h2 .num{color:#AD5038}
.c h3{font-size:20px;line-height:30px;margin:44px 0 8px;display:grid;grid-template-columns:56px 1fr}
.c h3 .num{color:#888888}
.c h4{font-size:18px;line-height:27px;margin:26px 0 4px 56px;display:grid;grid-template-columns:56px 1fr}
.c h4 .num{color:#888888;font-weight:400}
.c h3 .t,.c h4 .t{display:block}
.c .mk{display:inline-flex;gap:12px;align-items:center;margin-left:14px;font-weight:400}
.c .why{font-size:17px;line-height:25.5px;color:#666666;font-weight:400;margin-left:12px}
.c p{margin:12px 0;max-width:839px}
.c p.lead{font-size:22px;line-height:32px;margin:40px 0 12px;max-width:840px}
.c h1+p.lead,.c .parties+p.lead{margin-top:46px}
.c p.when,.c p.dw{font-size:17px;line-height:25.5px;color:#666666;margin:8px 0}
.c p.when .k,.c p.dw .k{color:#111111;font-weight:700}
.c h2.chap+p.when{margin-top:16px}
.c p.note{font-size:15px;line-height:22.5px;font-style:italic;color:#666666}
.c p.tb,.c ul.tb,.c ol.tb{margin-left:112px;max-width:727px;color:#444444}
.c p.tb{margin-top:4px}
.c ul,.c ol{margin:8px 0 14px;padding-left:34px;max-width:839px}
.c ul{list-style-type:disc}
.c ul ul{list-style-type:'–  '}
.c ul ul ul{list-style-type:circle;color:#666666;font-size:17px;line-height:25.5px}
.c ol{list-style-type:decimal}
.c li{margin:3px 0}
.c strong,.c b{font-weight:700}
.c em{font-style:italic}
.c code{font-family:ui-monospace,Menlo,monospace;font-size:16px;background:#F4F4F4;padding:1px 6px}
.c hr{border:0;border-top:1.5px solid #E2E2E2;margin:34px 0}
.c blockquote{margin:18px 0;padding-left:56px;position:relative;font-size:22px;line-height:32px;font-style:italic;max-width:839px}
.c blockquote::before{content:"\201C";position:absolute;left:16px;top:-4px;font-size:44px;line-height:44px;font-style:normal;color:#AD5038}
/* marks (Foundations F2 · Tags and status): hand → "To confirm" dot, parked → Optional tag, pin → checkpoint square */
.c .st{display:inline-flex;gap:8px;align-items:center;font-size:15px;line-height:20px;color:#666666;font-weight:400;white-space:nowrap;vertical-align:1px}
.c .st i{width:8px;height:8px;border-radius:50%;background:#AD5038;display:inline-block}
.c .tag{display:inline-block;font-size:15px;line-height:20px;font-weight:700;padding:3px 10px;background:#AD5038;color:#FFFFFF;vertical-align:1px;white-space:nowrap}
.c .cp{display:inline-block;width:12px;height:12px;background:#111111;margin-right:10px;vertical-align:1px}
/* footnotes: short ink rule, 7.5/11 pt grey */
.c ol.fns{list-style:none;padding:14px 0 0;margin:20px 0 28px;font-size:15px;line-height:22px;color:#666666;max-width:839px;position:relative}
.c ol.fns::before{content:"";position:absolute;left:0;top:0;width:120px;height:1.5px;background:#111111}
.c ol.fns.cont{padding-top:0}
.c ol.fns.cont::before{display:none}
.c ol.fns li{position:relative;padding-left:34px;margin:0 0 2px}
.c ol.fns .fnn{position:absolute;left:0;top:0}
.c ol.fns .url{color:#888888;margin-left:8px}
.c sup.fn{font-size:12px;line-height:0;vertical-align:9px;color:#AD5038;font-weight:700;margin-left:1px}
/* tables: caps header over an ink rule, grey row rules (F3 · the NDA's rows) */
.c table{border-collapse:collapse;width:100%;margin:20px 0 30px}
.c table.cont{margin-top:0}
.c th{text-align:left;font-size:15px;line-height:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#888888;padding:0 22px 14px 0;border-bottom:1.5px solid #111111;vertical-align:bottom}
.c td{text-align:left;padding:14px 22px 14px 0;border-bottom:1.5px solid #E2E2E2;vertical-align:top}
.c th:last-child,.c td:last-child{padding-right:0}
.c td.num,.c th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.c td:first-child.num{text-align:left;color:#888888;width:56px}
.c tr.group td{font-weight:700}
.c tr.total td{font-weight:700;border-bottom:0;border-top:1.5px solid #111111}
.c table.kv{border-top:1.5px solid #111111}
.c table.kv td:first-child{width:192.8px;color:#888888}
/* the Overview outline, flattened: phase rows on the Contract's number column, item rows under them */
.c .phh{display:grid;grid-template-columns:56px 1fr auto;align-items:baseline;font-weight:700;margin:20px 0 0;padding-bottom:8px}
.c .phh .num{color:#888888}
.c .phh .cnt{font-size:17px;line-height:25.5px;color:#888888;font-weight:400}
.c ul.phl{list-style:none;padding:0 0 14px;margin:0 0 6px;max-width:none;border-bottom:1.5px solid #E2E2E2}
.c ul.phl.cont{margin-top:0}
.c ul.phl li{display:block;position:relative;padding-left:112px;margin:0}
.c ul.phl li .tn{position:absolute;left:56px;top:0;color:#888888}
</style>
